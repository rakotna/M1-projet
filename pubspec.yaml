name: scolar_ai
description: ScolarAI - OCR Bulletins Scolaires Malgaches 2026
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & Video Stream
  camera: ^0.11.0
  image: ^4.1.0

  # TFLite YOLO
  tflite_flutter: ^0.11.0

  # HTTP API TrOCR
  http: ^1.2.0
  dio: ^5.4.0

  # Firebase
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2

  # UI & Animations
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.3
  google_fonts: ^6.2.1

  # PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0

  # Utils
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.3.3
  permission_handler: ^11.3.0
  flutter_svg: ^2.0.10+1

  # ── Exploration screen (NOUVELLES) ──
  image_picker: ^1.1.2       # Import depuis galerie ou caméra
  excel: ^4.0.6              # Génération fichier .xlsx natif Dart
  path_provider: ^2.1.4      # Accès au dossier temporaire pour sauvegarder le .xlsx
  share_plus: ^10.0.2        # Partage / téléchargement du fichier Excel généré
  sqflite: ^2.4.2
  path: ^1.9.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/animations/
    - assets/images/
